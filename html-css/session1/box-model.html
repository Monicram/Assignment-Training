<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Box Model</title>
  <link rel="stylesheet" href="css/box-model.css" />
</head>
<body>
  <div class="box">I am a box</div>
  <div class="content-box">content-box (default)</div>
  <div class="border-box">border-box</div>
  <h2>Padding vs Margin</h2>
  <div class="padding-demo">This box uses padding for spacing</div>
  <div class="margin-demo">This box uses margin for spacing</div>
</body>
</html>

<!--The total rendered width of the box is 300px because box-sizing: border-box 
includes the padding and border within the specified width.
If box-sizing: border-box is removed, the padding and border are added to the width, 
making the box wider than 300px (348px in this example).-->

<!--The content-box is wider because its padding and border are added outside the 300px width.
The border-box stays 300px wide because the padding and border are included inside the widt-->

<!--Padding adds space inside the element, so the background color extends into that space.
Margin adds space outside the element, so the background color does not cover it.
Use padding for internal spacing and margin for spacing between elements.-->
