<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Layout</title>
    <link rel="stylesheet" href="css/layout.css">
</head>
<body>

<header>
    <h1>My Website</h1>
</header>

<nav class="navbar">
    <div class="logo">Logo</div>

    <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
</nav>

<main>

    <section class="hero">
        <h2>Welcome</h2>
        <p>This is my responsive webpage.</p>

        <img src="https://picsum.photos/800/300" alt="Sample Image">
    </section>

    <section class="cards">

        <div class="card">
            <h3>Card 1</h3>
            <p>This is the first card.</p>
        </div>

        <div class="card">
            <h3>Card 2</h3>
            <p>This is the second card.</p>
        </div>

        <div class="card">
            <h3>Card 3</h3>
            <p>This is the third card.</p>
        </div>

    </section>

</main>

<footer>
    <p>© 2026 My Website</p>
</footer>

</body>
</html>
